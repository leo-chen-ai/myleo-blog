<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-label="同一种错反复出现，就改变产生错误的条件"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1080" height="690" rx="24" fill="#f5f7fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" fill="#172554" font-weight="600">同一种错反复出现，就改变产生错误的条件</text><text x="48" y="96" font-size="19" fill="#475569">例子：多个页面各自计算订单总价，改一次就漏掉另一处。</text><rect x="90" y="145" width="900" height="98" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="112" y="184" font-size="24" fill="#172554" font-weight="600">1 先改结构</text><text x="112" y="222" font-size="20" fill="#475569">统一订单金额的计算入口，删除散落的旧算法</text><rect x="90" y="265" width="900" height="98" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="304" font-size="24" fill="#172554" font-weight="600">2 再用类型和自动检查限制</text><text x="112" y="342" font-size="20" fill="#475569">让不合法状态难以表达；阻止新增重复计算入口</text><rect x="90" y="385" width="900" height="98" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="424" font-size="24" fill="#172554" font-weight="600">3 用测试覆盖真实行为</text><text x="112" y="462" font-size="20" fill="#475569">给定订单明细，断言最终金额；拿旧错误验证检查能失败</text><rect x="90" y="505" width="900" height="98" rx="16" fill="#fff0df" stroke="#cbd5e1"/><text x="112" y="544" font-size="24" fill="#172554" font-weight="600">4 文档保留需要判断的规则</text><text x="112" y="582" font-size="20" fill="#475569">解释折扣的业务含义、例外和理由</text><path d="M540 247 V260" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 367 V380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 487 V500" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="90" y="650" font-size="20" fill="#475569">从上往下选择能解决问题的一层，不必把每种检查都加一遍。</text></g></svg>