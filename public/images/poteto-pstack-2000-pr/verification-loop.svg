<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="能继续工作的关键：让 AI 看见成功与失败"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1080" height="650" rx="24" fill="#f5f7fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" fill="#172554" font-weight="600">能继续工作的关键：让 AI 看见成功与失败</text><text x="48" y="96" font-size="19" fill="#475569">例子：饭馆订单导出漏行，不能只检查“导出成功”提示。</text><rect x="48" y="150" width="280" height="150" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="70" y="189" font-size="24" fill="#172554" font-weight="600">准备已知数据</text><text x="70" y="227" font-size="20" fill="#475569">订单账本里有 60 条记录</text><text x="70" y="256" font-size="20" fill="#475569">含取消单和跨天订单</text><rect x="400" y="150" width="280" height="150" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="422" y="189" font-size="24" fill="#172554" font-weight="600">走真实导出流程</text><text x="422" y="227" font-size="20" fill="#475569">从页面选择日期</text><text x="422" y="256" font-size="20" fill="#475569">点击导出，拿到文件</text><rect x="752" y="150" width="280" height="150" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="774" y="189" font-size="24" fill="#172554" font-weight="600">比较实际结果</text><text x="774" y="227" font-size="20" fill="#475569">逐条核对订单号</text><text x="774" y="256" font-size="20" fill="#475569">检查重复、缺漏和金额</text><path d="M338 225 H390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 225 H742" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="400" width="280" height="135" rx="16" fill="#fff0df" stroke="#cbd5e1"/><text x="422" y="439" font-size="24" fill="#172554" font-weight="600">失败：定位后再改</text><text x="422" y="477" font-size="20" fill="#475569">保留错误样本和日志</text><text x="422" y="506" font-size="20" fill="#475569">修改后重跑同一流程</text><path d="M782 310 V355 H540 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="590" y="345" font-size="18" fill="#475569">不符合</text><text x="960" y="355" font-size="18" fill="#475569">符合</text><path d="M390 468 H360 V225 H390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="752" y="400" width="280" height="135" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="774" y="439" font-size="24" fill="#172554" font-weight="600">通过：保留证据</text><text x="774" y="477" font-size="20" fill="#475569">导出文件与比对结果</text><text x="774" y="506" font-size="20" fill="#475569">注明所用版本和数据</text><path d="M945 310 V390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="48" y="596" font-size="19" fill="#475569">60 条是本文示例数据。图中并未声称覆盖了所有订单情况。</text></g></svg>