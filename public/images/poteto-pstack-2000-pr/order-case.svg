<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-label="完整案例：重试一次，为什么多出一份订单？"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1080" height="790" rx="24" fill="#f5f7fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" fill="#172554" font-weight="600">完整案例：重试一次，为什么多出一份订单？</text><text x="48" y="96" font-size="19" fill="#475569">示例推演：先证明问题存在，再验证修复；业务边界由人确定。</text><rect x="90" y="133" width="900" height="80" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="172" font-size="24" fill="#172554" font-weight="600">1 接准反馈</text><text x="365" y="172" font-size="20" fill="#475569">第一次响应丢失，重试后账本出现两条。</text><path d="M540 217 V226" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="231" width="900" height="80" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="270" font-size="24" fill="#172554" font-weight="600">2 固定复现</text><text x="365" y="270" font-size="20" fill="#475569">使用同一请求标识，在测试环境重放请求。</text><path d="M540 315 V324" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="329" width="900" height="80" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="368" font-size="24" fill="#172554" font-weight="600">3 修正机制</text><text x="365" y="368" font-size="20" fill="#475569">保存请求处理结果，重试返回原结果。</text><path d="M540 413 V422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="427" width="900" height="80" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="112" y="466" font-size="24" fill="#172554" font-weight="600">4 检查边界</text><text x="365" y="466" font-size="20" fill="#475569">覆盖并发、取消、过期，以及不同请求。</text><path d="M540 511 V520" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="525" width="900" height="80" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="112" y="564" font-size="24" fill="#172554" font-weight="600">5 形成交付证据</text><text x="365" y="564" font-size="20" fill="#475569">确认同一请求只留一条订单，独立检查当前改动。</text><path d="M540 609 V618" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="623" width="900" height="80" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="112" y="662" font-size="24" fill="#172554" font-weight="600">6 防止同类回归</text><text x="365" y="662" font-size="20" fill="#475569">保留行为检查，统一订单创建入口。</text><text x="90" y="758" font-size="19" fill="#475569">规则仍要说清：同一请求的有效期、退款条件和异常补偿，不能靠 AI 猜。</text></g></svg>