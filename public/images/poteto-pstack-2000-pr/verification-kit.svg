<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-label="验证能力需要说明书，也需要能用的工具"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1080" height="610" rx="24" fill="#f5f7fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" fill="#172554" font-weight="600">验证能力需要说明书，也需要能用的工具</text><text x="48" y="96" font-size="19" fill="#475569">新来的员工需要知道菜在哪、怎么做，以及怎样判断做对了。</text><rect x="48" y="155" width="300" height="260" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="70" y="194" font-size="24" fill="#172554" font-weight="600">技能说明</text><text x="70" y="232" font-size="20" fill="#475569">何时使用</text><text x="70" y="261" font-size="20" fill="#475569">怎样启动和检查环境</text><text x="70" y="290" font-size="20" fill="#475569">怎样执行与收集证据</text><text x="70" y="319" font-size="20" fill="#475569">怎样清理测试数据</text><rect x="390" y="155" width="300" height="260" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="412" y="194" font-size="24" fill="#172554" font-weight="600">功能地图</text><text x="412" y="232" font-size="20" fill="#475569">导出功能从哪里进入</text><text x="412" y="261" font-size="20" fill="#475569">需要什么账号和订单</text><text x="412" y="290" font-size="20" fill="#475569">操作顺序是什么</text><text x="412" y="319" font-size="20" fill="#475569">什么结果才算正确</text><rect x="732" y="155" width="300" height="260" rx="16" fill="#fff0df" stroke="#cbd5e1"/><text x="754" y="194" font-size="24" fill="#172554" font-weight="600">操作工具</text><text x="754" y="232" font-size="20" fill="#475569">启动测试应用</text><text x="754" y="261" font-size="20" fill="#475569">操作真实页面</text><text x="754" y="290" font-size="20" fill="#475569">读取导出文件</text><text x="754" y="319" font-size="20" fill="#475569">返回明确错误与结果</text><path d="M358 285 H380" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 285 H722" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="55" y="479" font-size="21" fill="#475569">页面变化 → 更新功能地图；工具失效 → 修工具；产品出错 → 报告或修产品。</text><text x="55" y="532" font-size="21" fill="#475569">菜单不能为了“检查通过”，把顾客实际点不到的菜写成正常供应。</text></g></svg>