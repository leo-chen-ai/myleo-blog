<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="验证稳定以后，才扩大并行"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1080" height="660" rx="24" fill="#f5f7fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="57" font-size="30" fill="#172554" font-weight="600">验证稳定以后，才扩大并行</text><text x="48" y="96" font-size="19" fill="#475569">像前台分派订单：每个厨师有自己的工位，出菜仍要检查。</text><rect x="48" y="260" width="245" height="160" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="70" y="299" font-size="24" fill="#172554" font-weight="600">协调者</text><text x="70" y="337" font-size="20" fill="#475569">接收反馈、明确任务</text><text x="70" y="366" font-size="20" fill="#475569">分派、追踪和汇总</text><rect x="405" y="140" width="305" height="110" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="427" y="179" font-size="24" fill="#172554" font-weight="600">执行者 A</text><text x="427" y="217" font-size="20" fill="#475569">独立环境：修导出漏行</text><path d="M303 340 H350 V195 H395" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="325" width="305" height="110" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="427" y="364" font-size="24" fill="#172554" font-weight="600">执行者 B</text><text x="427" y="402" font-size="20" fill="#475569">独立环境：改订单搜索</text><path d="M303 340 H350 V380 H395" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="510" width="305" height="110" rx="16" fill="#e7efff" stroke="#cbd5e1"/><text x="427" y="549" font-size="24" fill="#172554" font-weight="600">执行者 C</text><text x="427" y="587" font-size="20" fill="#475569">独立环境：处理菜单布局</text><path d="M303 340 H350 V565 H395" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="810" y="260" width="222" height="175" rx="16" fill="#dcf3ea" stroke="#cbd5e1"/><text x="832" y="299" font-size="24" fill="#172554" font-weight="600">检查与集成</text><text x="832" y="337" font-size="20" fill="#475569">分别验证改动</text><text x="832" y="366" font-size="20" fill="#475569">检查相互影响</text><text x="832" y="395" font-size="20" fill="#475569">按依赖顺序合入</text><path d="M720 195 H765 V340 H800" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 380 H765 V340 H800" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 565 H765 V340 H800" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="48" y="646" font-size="19" fill="#475569">独立目录仍可能共享数据库、端口和账号，需要额外隔离。</text></g></svg>