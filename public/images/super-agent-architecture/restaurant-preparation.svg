<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="提前准备：备菜可以先做，下单仍有边界"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="700" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">提前准备：备菜可以先做，下单仍有边界</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">按规则投入后台资源，减少等待，也接受尝试可能没有产出</text><rect x="300" y="110" width="400" height="90" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="143" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">收到环境信号</text><text x="500.0" y="174" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">饭馆：客人还在讨论吃什么</text><path d="M500 200 L500 235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="250" y="240" width="500" height="115" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="500.0" y="273" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">在允许范围内先准备</text><text x="500.0" y="304" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">饭馆：先备常用配菜</text><text x="500.0" y="331" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">Agent：查日程、复现问题、准备草稿</text><path d="M250 300 L160 410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M750 300 L830 410" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="415" width="360" height="125" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="220.0" y="448" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">结果没有价值</text><text x="220.0" y="479" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">准备工作可能白费</text><text x="220.0" y="506" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">不强行交付，不打扰用户</text><rect x="580" y="415" width="380" height="125" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="770.0" y="448" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">有可用结果</text><text x="770.0" y="479" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">简短汇报或交付草稿</text><text x="770.0" y="506" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">需用户确认的操作，等待确认</text><text x="500" y="600" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">收益：少等待、少催促；代价：额外算力与误触发风险</text><text x="500" y="645" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">生活例子帮助理解；具体行动范围由任务规则与权限决定</text></g></svg>