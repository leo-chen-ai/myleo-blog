<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-label="上下文怎样一步步找回来？"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="635" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">上下文怎样一步步找回来？</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">当前保留够用的内容与关联编号，完整资料需要时再读取</text><rect x="35" y="160" width="195" height="150" rx="13" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/><text x="132.5" y="193" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">当前评论</text><text x="132.5" y="224" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">“按群里后来定的改”</text><text x="132.5" y="251" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">附带所属 PR 编号</text><rect x="280" y="160" width="195" height="150" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="377.5" y="193" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">PR 讨论串</text><text x="377.5" y="224" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">找到这项修改的讨论</text><text x="377.5" y="251" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">附带负责 Worker 编号</text><rect x="525" y="160" width="195" height="150" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="622.5" y="193" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Worker 记录</text><text x="622.5" y="224" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">找到任务与执行背景</text><text x="622.5" y="251" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">附带关联群聊编号</text><rect x="770" y="160" width="195" height="150" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="867.5" y="193" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">群聊讨论</text><text x="867.5" y="224" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">读取原始需求</text><text x="867.5" y="251" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">查找后续方案变更</text><path d="M230 235 L270 235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M475 235 L515 235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M720 235 L760 235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="65" y="375" width="405" height="135" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="267.5" y="408" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Inline：放在当前工作台</text><text x="267.5" y="439" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">眼前消息、附近讨论、必要摘要</text><text x="267.5" y="466" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">紧密关联对象的编号</text><rect x="530" y="375" width="405" height="135" rx="13" fill="#fefce8" stroke="#fde047" stroke-width="2"/><text x="732.5" y="408" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Spill：留在外部资料库</text><text x="732.5" y="439" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">长日志、完整历史、低频材料</text><text x="732.5" y="466" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">保留续读与检索入口</text><text x="500" y="566" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">找回资料依赖关联记录；跨月记忆与旧决定更新仍有难题</text></g></svg>