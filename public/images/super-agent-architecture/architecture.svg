<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-label="DeepSeek Super-agent：整体结构"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="780" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">DeepSeek Super-agent：整体结构</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">协调与执行分开，普通程序与模型各做适合自己的事</text><rect x="40" y="115" width="920" height="80" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="148" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">工作环境：群聊、GitHub 评论、测试结果、邮件</text><path d="M500 195 L500 225" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="335" y="230" width="330" height="90" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="263" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">入口过滤与事件路由</text><text x="500.0" y="294" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">先筛消息，再识别任务归属</text><path d="M335 276 L270 365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M665 276 L740 365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="45" y="370" width="365" height="120" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="227.5" y="403" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Router：全局协调</text><text x="227.5" y="434" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">分派新任务、跨任务协调</text><text x="227.5" y="461" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">汇总关键决定，统一回复</text><rect x="575" y="370" width="380" height="120" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="765.0" y="403" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Workers：并行执行</text><text x="765.0" y="434" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">各自专注任务，使用执行工具</text><text x="765.0" y="461" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">后续事件可直达订阅者</text><path d="M410 405 L575 405" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="490" y="391" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">分派</text><path d="M575 463 L410 463" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="490" y="451" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">汇报</text><rect x="45" y="555" width="560" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="325.0" y="588" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">上下文关联 + 持久化状态</text><text x="325.0" y="619" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">按需找回背景，保存会话与任务记录</text><rect x="650" y="555" width="305" height="100" rx="13" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="802.5" y="588" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">独立 Watchdog</text><text x="802.5" y="619" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">检查故障与任务进展</text><path d="M225 490 L225 553" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M765 490 L800 553" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="500" y="709" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">执行工具可异步启动；真实执行环境可通过端侧程序接入</text><text x="500" y="743" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">示意图按原文简化，不代表完整产品功能清单</text></g></svg>