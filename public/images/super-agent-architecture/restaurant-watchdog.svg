<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="巡店不只查人在不在，还要查菜出了没有"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="620" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">巡店不只查人在不在，还要查菜出了没有</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">Watchdog 同时检查基础设施与任务进展</text><rect x="285" y="115" width="430" height="100" rx="13" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="500.0" y="148" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">独立 Watchdog 定时巡检</text><text x="500.0" y="179" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">饭馆里的店长巡场</text><path d="M320 215 L250 295" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M680 215 L750 295" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="300" width="410" height="160" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="255.0" y="333" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">第一类：设备或服务故障</text><text x="255.0" y="364" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">饭馆：灶台熄火、传单系统坏了</text><text x="255.0" y="391" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">Agent：接口报错、状态恢复失败</text><text x="255.0" y="418" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">检查基础设施是否正常</text><rect x="540" y="300" width="410" height="160" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="745.0" y="333" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">第二类：忙着却没有进展</text><text x="745.0" y="364" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">饭馆：反复忙碌，半小时没出菜</text><text x="745.0" y="391" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">Agent：重复失败、偏离任务目标</text><text x="745.0" y="418" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">检查任务是否真正推进</text><text x="500" y="523" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">发现异常后介入处理；巡检和调整能力也需要受控</text><text x="500" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">进程还活着，与任务有进展，是两个不同的检查目标</text></g></svg>