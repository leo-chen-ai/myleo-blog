<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-label="消息如何找到正确的任务？"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="795" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">消息如何找到正确的任务？</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">新任务需要判断，已经确定的归属可以由程序直接处理</text><rect x="330" y="105" width="340" height="78" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="138" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">群聊消息 / PR 评论 / CI 通知</text><path d="M500 183 L500 215" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="280" y="220" width="440" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="253" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">程序层筛选</text><text x="500.0" y="284" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">来源、范围、白名单等确定条件</text><path d="M500 318 L500 350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="280" y="355" width="440" height="98" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="388" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">模型理解候选事件</text><text x="500.0" y="419" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">按自然语言规则判断是否值得行动</text><path d="M500 453 L500 485" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="280" y="490" width="440" height="78" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500.0" y="523" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">这个讨论串已有订阅者吗？</text><path d="M280 530 L195 605" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M720 530 L805 605" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="210" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">有</text><text x="790" y="565" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">没有</text><rect x="40" y="610" width="360" height="100" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="220.0" y="643" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">程序直达对应 Worker</text><text x="220.0" y="674" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">继续处理评论与测试结果</text><rect x="600" y="610" width="360" height="100" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="780.0" y="643" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Router 判断并分派</text><text x="780.0" y="674" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">创建任务、建立订阅</text><text x="500" y="761" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">明显无关消息可在入口被忽略；关键结果仍由 Router 统一回复</text></g></svg>