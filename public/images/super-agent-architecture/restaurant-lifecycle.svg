<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" role="img" aria-label="从点菜到上桌：对照一项修复任务"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="845" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">从点菜到上桌：对照一项修复任务</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">同一个订单贯穿全程，换个地方补充要求也能接上</text><text x="260" y="128" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">饭馆里的事</text><text x="745" y="128" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">Agent 系统里的事</text><rect x="50" y="155" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="188" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">迎宾接到点单</text><rect x="535" y="155" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="188" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">识别群里的导出超时反馈</text><path d="M470 193 L530 193" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 231 L260 252" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 231 L745 252" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="255" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="288" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">前台建单，交给厨师</text><rect x="535" y="255" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="288" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Router 分派 Worker 排查</text><path d="M470 293 L530 293" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 331 L260 352" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 331 L745 352" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="355" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="388" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">改单写回同一张订单</text><rect x="535" y="355" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="388" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">群聊与 PR 关联，补充要求送达</text><path d="M470 393 L530 393" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 431 L260 452" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 431 L745 452" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="455" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="488" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">厨房制作，前台继续接话</text><rect x="535" y="455" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="488" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">后台运行测试，同时处理新要求</text><path d="M470 493 L530 493" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 531 L260 552" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 531 L745 552" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="555" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="588" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">上菜报进度，账本留记录</text><rect x="535" y="555" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="588" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">交付结果，保存任务与讨论记录</text><path d="M470 593 L530 593" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M260 631 L260 652" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 631 L745 652" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="655" width="420" height="76" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="260.0" y="688" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">店长查漏单和迟迟不出菜</text><rect x="535" y="655" width="415" height="76" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="742.5" y="688" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">Watchdog 检查故障与停滞</text><path d="M470 693 L530 693" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/></g></svg>