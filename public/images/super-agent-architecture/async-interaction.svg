<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="后台在执行，前台还能接要求"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="650" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">后台在执行，前台还能接要求</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">异步工具让会话不必一直等耗时操作完成</text><text x="80" y="150" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">同步</text><rect x="150" y="110" width="180" height="85" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="240.0" y="143" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">启动测试</text><path d="M330 152 L380 152" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="385" y="110" width="300" height="85" rx="13" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="535.0" y="143" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">等待工具完成</text><path d="M685 152 L735 152" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="740" y="110" width="215" height="85" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="847.5" y="143" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">再处理新消息</text><text x="535" y="236" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">用户补充要求时，也要等后台命令结束</text><text x="80" y="345" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">异步</text><rect x="150" y="300" width="180" height="95" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="240.0" y="333" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">启动测试</text><text x="240.0" y="364" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">立即返回“已开始”</text><path d="M330 345 L380 345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="385" y="300" width="300" height="95" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="535.0" y="333" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">继续处理新消息</text><text x="535.0" y="364" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">可以调整要求、发起停止</text><path d="M685 345 L735 345" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="740" y="300" width="215" height="95" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="847.5" y="333" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">接收完成事件</text><text x="847.5" y="364" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">结合当前要求继续</text><rect x="190" y="465" width="720" height="75" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="550.0" y="498" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">后台工具独立运行，完成结果随后作为新事件送回</text><path d="M240 395 L240 460" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 6"/><path d="M850 465 L850 400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="500" y="595" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">新消息在当前推理步结束后处理，不是任意瞬间立刻打断</text></g></svg>