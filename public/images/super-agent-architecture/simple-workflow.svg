<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">Super-agent 简化分工示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="960" height="440" rx="20" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="43" font-size="23" font-weight="700" fill="#0f172a">一个负责协调，多个并行干活</text><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="35" y="155" width="190" height="100" rx="14"/><rect x="330" y="145" width="250" height="120" rx="14" fill="#eff6ff" stroke="#60a5fa"/><rect x="705" y="85" width="215" height="85" rx="14"/><rect x="705" y="245" width="215" height="85" rx="14"/></g><g fill="#0f172a" font-size="21" font-weight="600"><text x="130" y="194">群聊 / PR 评论</text><text x="455" y="187">Router 协调员</text><text x="812" y="121">Worker A</text><text x="812" y="281">Worker B</text></g><g fill="#475569" font-size="17"><text x="130" y="226">提出要求、补充信息</text><text x="455" y="222">接消息 · 分任务 · 统一回复</text><text x="812" y="150">排查导出超时</text><text x="812" y="310">开发另一个功能</text><text x="480" y="400">后续评论、测试结果，可以直接送到负责该任务的 Worker</text></g><g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M225 180H320"/><path d="M330 240H235"/><path d="M580 180L695 130"/><path d="M580 232L695 280"/></g><text x="275" y="278" font-size="16" fill="#475569">回复结果</text><text x="641" y="205" font-size="16" fill="#475569">分派任务</text></g></svg>
