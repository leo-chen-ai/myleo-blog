<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="725" viewBox="0 0 1000 725" role="img" aria-label="计算、状态、执行环境：分开部署"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="725" rx="20" fill="#f8fafc"/><g font-family="system-ui,-apple-system,sans-serif"><text x="500" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">计算、状态、执行环境：分开部署</text><text x="500" y="77" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">进程可替换，记录要保留，真实工作环境可以留在原地</text><rect x="65" y="125" width="410" height="135" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="270.0" y="158" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">云端 Agent 计算</text><text x="270.0" y="189" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">推进模型调用、事件处理和调度</text><text x="270.0" y="216" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">计算进程可以重启或替换</text><rect x="635" y="125" width="300" height="135" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="785.0" y="158" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">持久化状态</text><text x="785.0" y="189" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">会话记录、任务关联等</text><text x="785.0" y="216" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">保存在数据库</text><path d="M475 165 L630 165" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 220 L480 220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="555" y="147" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">保存</text><text x="555" y="244" text-anchor="middle" font-size="16" fill="#475569" font-weight="400">加载</text><path d="M270 260 L270 350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M350 260 L770 350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><rect x="65" y="355" width="410" height="175" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="270.0" y="388" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">用户开发机</text><text x="270.0" y="419" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">轻量 daemon 接收命令、返回结果</text><text x="270.0" y="446" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">代码、未提交修改、依赖留在本地</text><text x="270.0" y="473" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">设备离线时，相关执行需要等待</text><rect x="555" y="355" width="380" height="175" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="745.0" y="388" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">其他执行环境</text><text x="745.0" y="419" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">托管机器或按需创建的环境</text><text x="745.0" y="446" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">按任务需要选择接入</text><text x="745.0" y="473" text-anchor="middle" font-size="17" fill="#475569" font-weight="400">访问仍受网络与权限限制</text><rect x="65" y="585" width="870" height="80" rx="13" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="500.0" y="618" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="700">独立 Watchdog：检查服务是否正常，也检查任务是否真正推进</text></g></svg>